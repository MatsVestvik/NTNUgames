<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer metallic casing -->
  <circle cx="32" cy="32" r="30" fill="#131b2e" stroke="#00b4d8" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26" fill="#0d1322"/>
  
  <!-- Frequency wave ripples at top -->
  <path d="M12 24 Q 22 16, 32 24 T 52 24" fill="none" stroke="#f72585" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M16 28 Q 24 20, 32 28 T 48 28" fill="none" stroke="#7209b7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Semi-circular dial scale track -->
  <path d="M 10 38 A 22 22 0 0 1 54 38" fill="none" stroke="#1f2c47" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Target zone on the track (around center-top ~ 65 degrees) -->
  <path d="M 23 20 A 22 22 0 0 1 41 20" fill="none" stroke="#06d6a0" stroke-width="12"/>
  <path d="M 27 18 A 22 22 0 0 1 37 18" fill="none" stroke="#fb8500" stroke-width="12"/>
  <path d="M 30.5 17 A 22 22 0 0 1 33.5 17" fill="none" stroke="#ffd166" stroke-width="12"/>

  <!-- Dial Needle -->
  <line x1="32" y1="38" x2="32" y2="15" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="14" r="2.5" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>

  <!-- Center Pivot Knob -->
  <circle cx="32" cy="38" r="6" fill="#2b3954" stroke="#485c84" stroke-width="1.5"/>
  <circle cx="32" cy="38" r="2.5" fill="#00b4d8"/>

  <!-- Spectrum indicator dots -->
  <circle cx="10" cy="38" r="2.5" fill="#00b4d8"/>
  <circle cx="54" cy="38" r="2.5" fill="#f72585"/>

  <!-- Wavelength Sparkle -->
  <polygon points="32,7 33.5,10 36.5,11.5 33.5,13 32,16 30.5,13 27.5,11.5 30.5,10" fill="#ffd166"/>
</svg>

