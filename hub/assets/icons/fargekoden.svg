<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded grid background -->
  <rect x="4" y="4" width="56" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- 4x4 Color Grid representing Hues and Cues spectrum -->
  <!-- Row 1 -->
  <rect x="10" y="10" width="9" height="9" rx="2" fill="#ef4444"/>
  <rect x="22" y="10" width="9" height="9" rx="2" fill="#f97316"/>
  <rect x="34" y="10" width="9" height="9" rx="2" fill="#facc15"/>
  <rect x="46" y="10" width="9" height="9" rx="2" fill="#84cc16"/>
  <!-- Row 2 -->
  <rect x="10" y="22" width="9" height="9" rx="2" fill="#ec4899"/>
  <rect x="22" y="22" width="9" height="9" rx="2" fill="#a855f7"/>
  <rect x="34" y="22" width="9" height="9" rx="2" fill="#06d6a0"/>
  <rect x="46" y="22" width="9" height="9" rx="2" fill="#10b981"/>
  <!-- Row 3 -->
  <rect x="10" y="34" width="9" height="9" rx="2" fill="#8b5cf6"/>
  <rect x="22" y="34" width="9" height="9" rx="2" fill="#3b82f6"/>
  <rect x="34" y="34" width="9" height="9" rx="2" fill="#06b6d4"/>
  <rect x="46" y="34" width="9" height="9" rx="2" fill="#14b8a6"/>
  <!-- Row 4 -->
  <rect x="10" y="46" width="9" height="9" rx="2" fill="#6366f1"/>
  <rect x="22" y="46" width="9" height="9" rx="2" fill="#0284c7"/>
  <rect x="34" y="46" width="9" height="9" rx="2" fill="#0ea5e9"/>
  <rect x="46" y="46" width="9" height="9" rx="2" fill="#38bdf8"/>
  <!-- Guess Marker / Target Crosshair on a cell -->
  <rect x="20" y="20" width="13" height="13" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="26.5" cy="26.5" r="2" fill="#ffffff"/>
</svg>

